[project]
name = "salebot"
version = "0.1.0"
description = "Telegram bot that alerts on brand sales and product price drops (Hebrew UI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[job-queue]>=21",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "anthropic>=0.70",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "html2text>=2024.2.26",
    "imap-tools>=1.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/salebot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
